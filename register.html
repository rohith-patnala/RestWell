<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | RestWell</title>
<meta name="description" content="Create a RestWell account to start your 100-night trial, track orders, and save favourites.">
<link rel="canonical" href="https://example.com/register.html">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="global.css" rel="stylesheet">
<link href="auth.css" rel="stylesheet">
<style>
  /* Social Button Styles */
  .btn-social {
    background-color: #ffffff;
    border: 1px solid #dadce0;
    color: #3c4043;
    font-weight: 500;
    transition: background-color 0.2s, border-color 0.2s;
  }
  
  .btn-social:hover {
    background-color: #f8f9fa;
    border-color: #c1c4c8;
    color: #1a73e8;
  }

  .btn-apple {
    background-color: #000000;
    border: 1px solid #000000;
    color: #ffffff;
    font-weight: 500;
    transition: background-color 0.2s;
  }

  .btn-apple:hover {
    background-color: #333333;
    border-color: #333333;
    color: #ffffff;
  }
  .rtl-toggle{
    color:white;
  }
</style>
</head>
<body>
<input type="checkbox" id="darkMode" class="theme-input" aria-hidden="true">
<input type="checkbox" id="rtlMode" class="theme-input" aria-hidden="true">

<div class="auth-shell">
  <div class="auth-card anim-scale">
    <a class="brand" href="home1.html" aria-label="RestWell home">&nbsp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;<svg viewBox="0 0 40 40" width="40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#3A6B8C"/><path d="M8 26h24v4H8z" fill="#fff"/><path d="M8 18c4-3 8-3 12 0s8 3 12 0v6H8z" fill="#C9A66B"/></svg> RestWell</a>
    <h1>&ensp;&nbsp;Create your account</h1>
    <p class="text-muted">&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&nbsp;Start your 100-night trial in minutes.</p>
    
    <form action="login.html" method="get" class="auth-form">
      <div class="mb-3"><label for="name" class="form-label">Full name</label><input type="text" id="name" name="name" class="form-control" required autocomplete="name" placeholder="Your name"></div>
      <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" required autocomplete="email" placeholder="you@example.com"></div>
      <div class="mb-3"><label for="phone" class="form-label">Phone</label><input type="tel" id="phone" name="phone" class="form-control" required autocomplete="tel" placeholder="+91"></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8"></div>
      <div class="mb-3"><label for="confirm" class="form-label">Confirm password</label><input type="password" id="confirm" name="confirm" class="form-control" required autocomplete="new-password" placeholder="Re-enter password"></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="terms" required><label class="form-check-label" for="terms">I agree to the <a href="terms.html">Terms</a> and <a href="privacy-policy.html">Privacy Policy</a>.</label></div>
      
      <!-- Primary Create Account Button -->
      <button type="submit" class="btn btn-primary w-100 mb-3">Create account</button>
      
      <!-- Social Sign Up Buttons -->
      <div class="d-flex flex-column gap-2">
        <!-- Google Button with Official Color SVG -->
        <a href="/auth/google" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign up with Google</span>
        </a>

        <!-- Apple Button -->
        <a href="/auth/apple" class="btn btn-apple w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <i class="bi bi-apple fs-5"></i>
          <span>Sign up with Apple</span>
        </a>
      </div>
    </form>
    
    <div class="auth-divider"><span>or</span></div>
    <p class="text-center text-muted small">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
  
  <div class="auth-aside">
    <img src="https://thesleepcompany.in/cdn/shop/files/01_e3bf0abb-2e54-4804-957f-db75e784980b.webp?v=1758620774" alt="Person unboxing a new RestWell mattress" loading="lazy">
    <div class="auth-aside-overlay">
      <h2>Join 2 lakh sleepers.</h2>
      <p>Free delivery, 100-night trial, and 10-year warranty on every mattress.</p>
    </div>
  </div>
</div>

<div class="auth-controls">
  <label class="theme-toggle" for="darkMode" title="Toggle dark mode" aria-label="Toggle dark mode"></label>
  <label class="rtl-toggle" for="rtlMode" title="Toggle RTL" aria-label="Toggle right-to-left">RTL</label>
</div>
</body>
</html>
