<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | RestWell</title>
<meta name="description" content="Reset your RestWell account password. Enter your email and we'll send you a reset link.">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="global.css" rel="stylesheet">
<link href="auth.css" rel="stylesheet">

<style>
html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #f5f6f8;
}

/* 50% Form | 50% Image */
.auth-shell {
    display: flex;
    width: 100%;
    height: 100vh;
}

/* Left side (50%) */
.auth-card {
    width: 50%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4rem 5rem;
    background: #ffffff;
    box-shadow: none;
    border-radius: 0;
}

/* Right side (50%) */
.auth-aside {
    width: 50%;
    height: 100vh;
    position: relative;
}

.auth-aside img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.auth-aside-overlay {
    position: absolute;
    bottom: 40px;
    left: 40px;
    right: 40px;
    color: #fff;
    background: rgba(0,0,0,0.35);
    padding: 1.5rem;
    border-radius: 16px;
}

/* Top-right controls */
.auth-controls {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 12px;
    z-index: 1000;
}

/* Mobile: form full width, image hidden */
@media (max-width: 768px) {
    .auth-shell {
        flex-direction: column;
    }

    .auth-card {
        width: 100%;
        height: 100vh;
        padding: 2rem;
    }

    .auth-aside {
        display: none;
    }
}
</style>
</head>

<body>

<input type="checkbox" id="darkMode" class="theme-input" aria-hidden="true">
<input type="checkbox" id="rtlMode" class="theme-input" aria-hidden="true">

<div class="auth-shell">
    <div class="auth-card anim-scale">

        <a class="brand" href="home1.html" aria-label="RestWell home">
            <svg viewBox="0 0 40 40" width="40" fill="none" aria-hidden="true">
                <rect width="40" height="40" rx="10" fill="#3A6B8C"/>
                <path d="M8 26h24v4H8z" fill="#fff"/>
                <path d="M8 18c4-3 8-3 12 0s8 3 12 0v6H8z" fill="#C9A66B"/>
            </svg>
            RestWell
        </a>

        <h1 class="mt-4">Forgot password?</h1>
        <p class="text-muted">Enter your email and we'll send a reset link.</p>

        <form action="login.html" method="get" class="auth-form mt-4">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" required autocomplete="email" placeholder="you@example.com">
            </div>

            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>

        <div class="auth-divider my-4"><span>or</span></div>

        <p class="text-center text-muted small mb-0">
            Remembered it? <a href="login.html">Sign in</a>
        </p>

    </div>

    <div class="auth-aside">
        <img src="https://m.media-amazon.com/images/I/71q3yKbv9oL._AC_UF1000,1000_QL80_AIweblab1381794,T1_.jpg" alt="Calm bedside table with a lamp and a book" loading="lazy">
        <div class="auth-aside-overlay">
            <h2>Back to bed, soon.</h2>
            <p>Reset your password and get back to tracking your sleep.</p>
        </div>
    </div>
</div>

<div class="auth-controls">
    <label class="theme-toggle" for="darkMode" title="Toggle dark mode" aria-label="Toggle dark mode"></label>
    <label class="rtl-toggle" for="rtlMode" title="Toggle RTL" aria-label="Toggle right-to-left">RTL</label>
</div>

</body>
</html>
