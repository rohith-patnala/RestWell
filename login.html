<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | RestWell</title>
<meta name="description" content="Sign in to your RestWell account to track orders, manage your trial, and save favourites.">
<link rel="canonical" href="https://example.com/login.html">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="global.css" rel="stylesheet">
<link href="auth.css" rel="stylesheet">
<style>
  /* Social Button Styles */
  .btn-social {
    background-color: #ffffff;
    border: 1px solid #dadce0;
    color: #1a1919;
    font-weight: 500;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .rtl-toggle{
    color:white;
    margin-top: 21px;
  }
  .theme-toggle{
    margin-top: 25px;
  }
  .btn-social:hover {
    background-color: #f8f9fa;
    border-color: #c1c4c8;
    color: #1a73e8;
  }

  .btn-apple {
    background-color: #000000;
    border: 1px solid #000000;
    color: #ffffff;
    font-weight: 500;
    transition: background-color 0.2s;
  }

  .btn-apple:hover {
    background-color: #333333;
    border-color: #333333;
    color: #ffffff;
  }
</style>
</head>
<body>
<input type="checkbox" id="darkMode" class="theme-input" aria-hidden="true">
<input type="checkbox" id="rtlMode" class="theme-input" aria-hidden="true">

<div class="auth-shell">
  <div class="auth-card anim-scale">
    <a class="brand" href="home1.html" aria-label="RestWell home">&nbsp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;<svg viewBox="0 0 40 40" width="40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#3A6B8C"/><path d="M8 26h24v4H8z" fill="#fff"/><path d="M8 18c4-3 8-3 12 0s8 3 12 0v6H8z" fill="#C9A66B"/></svg> RestWell</a>
    <h1>&ensp;&ensp;&ensp;&nbsp;Welcome back</h1>
    <p class="text-muted">&ensp;&ensp;&ensp;Sign in to track orders and manage your trial.</p>
    
    <form action="home1.html" method="get" class="auth-form">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>
        <a href="forgot-password.html" class="small">Forgot password?</a>
      </div>
      
      <!-- Primary Sign In Button -->
      <button type="submit" class="btn btn-primary w-100 mb-3">Sign in</button>
      
      <!-- Social Sign In Buttons -->
      <div class="d-flex flex-column gap-2">
        <!-- Google Button with Official Color SVG -->
        <a href="/auth/google" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Sign in with Google</span>
        </a>

        <!-- Apple Button -->
        <a href="/auth/apple" class="btn btn-apple w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <i class="bi bi-apple fs-5"></i>
          <span>Sign in with Apple</span>
        </a>
      </div>
    </form>
    
    <div class="auth-divider"><span>or</span></div>
    <p class="text-center text-muted small">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
  
  <div class="auth-aside">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGHsJ5EE1WcbJBlcSVxIem9JeEQRSMMzLNNTHjEr6gHzrJpCkYF736msAq&s=10" alt="Cozy bedroom with a neatly made RestWell bed" loading="lazy">
    <div class="auth-aside-overlay">
      <h2>Sleep better, tonight.</h2>
      <p>Track your 100-night trial, manage returns, and save your favourite mattresses.</p>
    </div>
  </div>
</div>

<div class="auth-controls">
  <label class="theme-toggle" for="darkMode" title="Toggle dark mode" aria-label="Toggle dark mode"></label>
  <label class="rtl-toggle" for="rtlMode" title="Toggle RTL" aria-label="Toggle right-to-left">RTL</label>
</div>
</body>
</html>
