<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | RestWell</title>
<meta name="description" content="Sign in to your RestWell account to track orders, manage your trial, and save favourites.">
<link rel="canonical" href="https://example.com/login.html">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="global.css" rel="stylesheet">
<link href="auth.css" rel="stylesheet">
</head>
<body>
<input type="checkbox" id="darkMode" class="theme-input" aria-hidden="true">
<input type="checkbox" id="rtlMode" class="theme-input" aria-hidden="true">

<div class="auth-shell">
  <div class="auth-card anim-scale">
    <a class="brand" href="home1.html" aria-label="RestWell home"><svg viewBox="0 0 40 40" width="40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#3A6B8C"/><path d="M8 26h24v4H8z" fill="#fff"/><path d="M8 18c4-3 8-3 12 0s8 3 12 0v6H8z" fill="#C9A66B"/></svg> RestWell</a>
    <h1>Welcome back</h1>
    <p class="text-muted">Sign in to track orders and manage your trial.</p>
    <form action="home1.html" method="get" class="auth-form">
      <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" required autocomplete="email" placeholder="you@example.com"></div>
      <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="••••••••"></div>
      <div class="d-flex justify-content-between align-items-center mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><a href="forgot-password.html" class="small">Forgot password?</a></div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <p class="text-center text-muted small">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
  <div class="auth-aside">
    <img src="assets/images/auth-login.jpg" alt="Cozy bedroom with a neatly made RestWell bed" loading="lazy">
    <div class="auth-aside-overlay">
      <h2>Sleep better, tonight.</h2>
      <p>Track your 100-night trial, manage returns, and save your favourite mattresses.</p>
    </div>
  </div>
</div>
<div class="auth-controls">
  <label class="theme-toggle" for="darkMode" title="Toggle dark mode" aria-label="Toggle dark mode"></label>
  <label class="rtl-toggle" for="rtlMode" title="Toggle RTL" aria-label="Toggle right-to-left">RTL</label>
</div>
</body>
</html>
