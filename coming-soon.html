<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | RestWell Studio</title>
<meta name="description" content="Something restful is on the way. Be the first to know when RestWell Studio launches.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="global.css" rel="stylesheet">
<link href="status.css" rel="stylesheet">
</head>
<body>
<input type="checkbox" id="darkMode" class="theme-input" aria-hidden="true">
<input type="checkbox" id="rtlMode" class="theme-input" aria-hidden="true">

<div class="status-page coming-soon">
  <div class="status-content anim-scale">
    <a class="brand" href="home1.html" aria-label="RestWell home"><svg viewBox="0 0 40 40" width="48" fill="none" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#3A6B8C"/><path d="M8 26h24v4H8z" fill="#fff"/><path d="M8 18c4-3 8-3 12 0s8 3 12 0v6H8z" fill="#C9A66B"/></svg> RestWell Studio</a>
    <span class="eyebrow anim-fade-up">Coming soon</span>
    <h1>Something restful is on the way</h1>
    <p class="text-muted">We're putting the finishing touches on our new sleep technology line. Be the first to know when it launches.</p>
    <form class="status-form anim-fade-up delay-1" action="coming-soon.html" method="get">
      <input type="email" placeholder="you@example.com" aria-label="Email address" required>
      <button type="submit" class="btn btn-primary">Notify me</button>
    </form>
    <div class="countdown anim-fade-up delay-2">
      <div><strong>14</strong><span>Days</span></div>
      <div><strong>07</strong><span>Hours</span></div>
      <div><strong>32</strong><span>Mins</span></div>
      <div><strong>18</strong><span>Secs</span></div>
    </div>
    <img src="assets/images/status-coming-soon.jpg" alt="Concept render of the new RestWell Studio smart mattress" class="status-img anim-fade-in" loading="lazy">
  </div>
  <div class="status-controls">
    <label class="theme-toggle" for="darkMode" title="Toggle dark mode" aria-label="Toggle dark mode"></label>
    <label class="rtl-toggle" for="rtlMode" title="Toggle RTL" aria-label="Toggle right-to-left">RTL</label>
  </div>
</div>
</body>
</html>
