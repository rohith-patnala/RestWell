<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance | RestWell</title>
<meta name="description" content="RestWell is undergoing scheduled maintenance to bring you a better sleep experience. We'll be back shortly.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
  /* Base Layout & Centering Setup */
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background-color: #f8f9fa;
    color: #333;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* Status Container */
  .status-page {
    position: relative;
    width: 100%;
    max-width: 680px;
    padding: 2.5rem 1.5rem;
    margin: auto;
    text-align: center;
  }

  /* Content Block */
  .status-content {
    background: #ffffff;
    padding: 2.5rem;
    border-radius: 1rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  /* Branding */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.5rem;
    font-weight: 700;
    color: #3A6B8C;
    text-decoration: none;
    margin-bottom: 1.5rem;
  }

  /* Status Icon */
  .status-icon {
    font-size: 3rem;
    color: #3A6B8C;
    margin-bottom: 1rem;
  }

  /* Typography */
  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1rem;
    color: #2b3a4a;
  }

  p.text-muted {
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 1rem;
  }

  /* Action Buttons Grid/Flex */
  .status-actions {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin: 1.5rem 0 2rem;
    flex-wrap: wrap;
  }

  .status-actions .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
  }

  /* Image Styling */
  .status-img {
    max-width: 100%;
    height: auto;
    border-radius: 0.75rem;
    margin-top: 1rem;
    object-fit: cover;
  }

  /* Theme Controls (Bottom Corner or Top Right) */
  .status-controls {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .theme-toggle, .rtl-toggle {
    cursor: pointer;
    font-size: 0.875rem;
    padding: 0.35rem 0.75rem;
    border: 1px solid #dee2e6;
    border-radius: 20px;
    background: #fff;
    color: #6c757d;
    user-select: none;
    transition: all 0.2s ease;
  }

  .theme-toggle:hover, .rtl-toggle:hover {
    background: #e9ecef;
    color: #333;
  }

  .theme-input {
    display: none;
  }
</style>
</head>
<body>
<input type="checkbox" id="darkMode" class="theme-input" aria-hidden="true">
<input type="checkbox" id="rtlMode" class="theme-input" aria-hidden="true">

<div class="status-page maintenance">
  <div class="status-content anim-scale">
    <a class="brand" href="home1.html" aria-label="RestWell home">
      <svg viewBox="0 0 40 40" width="48" fill="none" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="#3A6B8C"/>
        <path d="M8 26h24v4H8z" fill="#fff"/>
        <path d="M8 18c4-3 8-3 12 0s8 3 12 0v6H8z" fill="#C9A66B"/>
      </svg> 
      RestWell
    </a>
    <div class="status-icon anim-float"><i class="bi bi-tools"></i></div>
    <h1>We're tucking the site in</h1>
    <p class="text-muted">RestWell is undergoing scheduled maintenance to bring you a better sleep experience. We'll be back shortly — usually within an hour.</p>
    <p class="text-muted">In the meantime, our sleep experts are still reachable:</p>
    <div class="status-actions">
      <a href="tel:+918001234567" class="btn btn-outline-primary btn-lg"><i class="bi bi-telephone"></i> Call us</a>
      <a href="mailto:hello@restwell.in" class="btn btn-outline-primary btn-lg"><i class="bi bi-envelope"></i> Email us</a>
    </div>
    <!-- <img src="assets/images/status-maintenance.jpg" alt="Workshop tools arranged neatly beside a RestWell mattress" class="status-img anim-fade-in" loading="lazy"> -->
  </div>
  <!-- <div class="status-controls">
    <label class="theme-toggle" for="darkMode" title="Toggle dark mode" aria-label="Toggle dark mode">🌙 Theme</label>
    <label class="rtl-toggle" for="rtlMode" title="Toggle RTL" aria-label="Toggle right-to-left">RTL</label>
  </div> -->
</div>
</body>
</html>
